name: Ubuntu headless

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential ca-certificates colmap curl ffmpeg \
            libssl-dev libvulkan1 mesa-vulkan-drivers pkg-config xz-utils

      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - name: Check scripts
        run: bash -n scripts/*.sh

      - name: Install and verify Brush
        run: ./scripts/setup-engines-linux.sh

      - name: Rust formatting, tests, and clippy
        run: |
          cargo fmt -- --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: COLMAP GPU policy integration (mock engines)
        run: |
          cargo build --locked --bin splatstudio
          python3 tests/colmap_backend_smoke.py target/debug/splatstudio

      - name: FFmpeg CLI integration
        run: |
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i testsrc=size=320x240:rate=10 -t 2 \
            -c:v mpeg4 /tmp/ooosplat-ci.mp4
          cargo run --locked --bin splatstudio -- probe /tmp/ooosplat-ci.mp4
          cargo run --locked --bin splatstudio -- \
            extract /tmp/ooosplat-ci.mp4 /tmp/ooosplat-ci-frames --quality fast
          test "$(find /tmp/ooosplat-ci-frames -maxdepth 1 -name '*.jpg' | wc -l)" -gt 0

      - name: Build headless distribution
        run: ./scripts/build-headless-linux.sh

      - name: Verify distribution
        run: |
          test -x dist-headless/splatstudio
          test -x dist-headless/engines/linux/brush/brush_app
          test -f dist-headless/engines/manifest.linux.json
          test -f dist-headless/TRADEMARK_POLICY.md
          test -f dist-headless/licenses/MIT.txt
          test -f dist-headless/licenses/MPL-2.0.txt
          test -f dist-headless/licenses/THIRD_PARTY_NOTICES.txt
          test -f dist-headless/licenses/Unicode-3.0.txt
          test -f dist-headless/licenses/Zlib.txt
          OOOSPLAT_ENGINE_DIR="$PWD/dist-headless/engines" \
            ./dist-headless/splatstudio health

      - name: Upload headless distribution
        uses: actions/upload-artifact@v7
        with:
          name: ooosplat-headless-linux-x86_64
          path: dist-headless/
          if-no-files-found: error
          retention-days: 14
