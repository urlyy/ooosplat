[package]
name = "ooo-splat"
version = "0.5.0"
description = "Headless video-to-Gaussian-Splatting pipeline for Ubuntu 24.04 x86_64"
authors = ["ooolabdev"]
license = "Apache-2.0"
repository = "https://github.com/urlyy/ooosplat"
homepage = "https://github.com/urlyy/ooosplat"
edition = "2021"
default-run = "splatstudio"

[lib]
name = "ooo_splat"

[[bin]]
name = "splatstudio"
path = "src/bin/splatstudio.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
